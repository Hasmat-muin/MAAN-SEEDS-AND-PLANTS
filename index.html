<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MAAN Seeds & Plants</title>
<style>
    :root{ --accent:#d4a373; --accent-light:#e9edc9; }
    body{ margin:0; width:100vw; height:100vh; overflow:hidden; background:#000; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:space-between; }
    .bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.6; }
    .overlay{ position:absolute; inset:0; z-index:2; background: linear-gradient(to bottom, rgba(27,67,50,0.8), rgba(0,0,0,0.9)); }
    .brand-block{ position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:20vh; }
    .brand-logo{ height:80px; width:80px; border-radius:50%; border:3px solid var(--accent); object-fit:cover; background:#fff;}
    .brand-name{ font-size:22px; font-weight:800; color:#fff; }
    .brand-name span{ color:var(--accent); }
    .bottom-block{ position:relative; z-index:3; padding-bottom:10vh; text-align:center; }
    .bottom-block p{ color:var(--accent-light); font-size:14px; margin-bottom:20px; }
    .btn{ display:inline-block; padding:15px 40px; background:var(--accent); color:#1b4332; font-weight:bold; border-radius:30px; text-decoration:none; }
</style>
</head>
<body>
    <video class="bg-video" autoplay muted loop playsinline><source src="sadsadsaddsa.mp4" type="video/mp4"></video>
    <div class="overlay"></div>
    <div class="brand-block">
        <img src="logo.jpg" alt="Logo" class="brand-logo" onerror="this.src='logo.JPG'">
        <div class="brand-name">MAAN <span>SEEDS</span></div>
    </div>
    <div class="bottom-block">
        <p>Premium Seeds & Plants for Your Garden</p>
        <a href="shop.html" class="btn">Enter Store</a>
    </div>
</body>
</html>
